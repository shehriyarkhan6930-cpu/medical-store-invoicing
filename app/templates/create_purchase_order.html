{% extends "base.html" %}

{% block title %}Create Purchase Order - Medical Store Invoicing System{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h1>Create Purchase Order</h1>
    </div>
    <div class="col-md-4 text-end">
        <a href="{{ url_for('purchase.list_orders') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Purchase Order Details</h5>
            </div>
            <div class="card-body">
                <form method="POST" id="poForm">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="supplier_id" class="form-label">Supplier <span class="text-danger">*</span></label>
                            <select class="form-control" id="supplier_id" name="supplier_id" required onchange="loadSupplierDetails()">
                                <option value="">-- Select Supplier --</option>
                                {% for supplier in suppliers %}
                                <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="supplier_contact" class="form-label">Contact</label>
                            <input type="text" class="form-control" id="supplier_contact" name="supplier_contact" readonly>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="po_date" class="form-label">PO Date</label>
                            <input type="date" class="form-control" id="po_date" name="po_date" value="{{ today }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="expected_delivery" class="form-label">Expected Delivery</label>
                            <input type="date" class="form-control" id="expected_delivery" name="expected_delivery" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label">Items <span class="text-danger">*</span></label>
                            <div id="po-items">
                                <div class="row mb-2 po-item-row">
                                    <div class="col-md-5">
                                        <select class="form-control item-product" name="item_product_id" onchange="updatePOItemPrice(this)" required>
                                            <option value="">-- Select Product --</option>
                                            {% for product in products %}
                                            <option value="{{ product.id }}" data-price="{{ product.cost_price }}">{{ product.name }} ({{ product.sku }})</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <input type="number" class="form-control" name="item_quantity" placeholder="Qty" min="1" value="1" onchange="calculatePOTotal()">
                                    </div>
                                    <div class="col-md-3">
                                        <input type="number" class="form-control" name="item_price" placeholder="Cost" step="0.01" onchange="calculatePOTotal()">
                                    </div>
                                    <div class="col-md-2">
                                        <button type="button" class="btn btn-sm btn-danger" onclick="removePORow(this)">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-sm btn-success mt-2" onclick="addPORow()">
                                <i class="fas fa-plus"></i> Add Row
                            </button>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="tax_percent" class="form-label">Tax %</label>
                            <input type="number" class="form-control" id="tax_percent" name="tax_percent" value="0" step="0.01" onchange="calculatePOTotal()">
                        </div>
                        <div class="col-md-6">
                            <label for="shipping_cost" class="form-label">Shipping Cost</label>
                            <input type="number" class="form-control" id="shipping_cost" name="shipping_cost" value="0" step="0.01" onchange="calculatePOTotal()">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Special instructions, delivery notes, etc."></textarea>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-primary" name="action" value="save_draft">
                                <i class="fas fa-save"></i> Save as Draft
                            </button>
                            <button type="submit" class="btn btn-success" name="action" value="send">
                                <i class="fas fa-paper-plane"></i> Create & Send
                            </button>
                            <a href="{{ url_for('purchase.list_orders') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Summary</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-6">Subtotal:</div>
                    <div class="col-6 text-end"><strong id="po-subtotal">₹0.00</strong></div>
                </div>
                <div class="row mb-3">
                    <div class="col-6">Tax Amount:</div>
                    <div class="col-6 text-end"><strong id="po-tax-amount">₹0.00</strong></div>
                </div>
                <div class="row mb-3">
                    <div class="col-6">Shipping:</div>
                    <div class="col-6 text-end"><strong id="po-shipping-shown">₹0.00</strong></div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-6"><h5>Total:</h5></div>
                    <div class="col-6 text-end"><h5 id="po-total-amount" class="text-primary">₹0.00</h5></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function addPORow() {
    const container = document.getElementById('po-items');
    const newRow = document.createElement('div');
    newRow.className = 'row mb-2 po-item-row';
    newRow.innerHTML = `
        <div class="col-md-5">
            <select class="form-control item-product" name="item_product_id" onchange="updatePOItemPrice(this)" required>
                <option value="">-- Select Product --</option>
                {% for product in products %}
                <option value="{{ product.id }}" data-price="{{ product.cost_price }}">{{ product.name }} ({{ product.sku }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" name="item_quantity" placeholder="Qty" min="1" value="1" onchange="calculatePOTotal()">
        </div>
        <div class="col-md-3">
            <input type="number" class="form-control" name="item_price" placeholder="Cost" step="0.01" onchange="calculatePOTotal()">
        </div>
        <div class="col-md-2">
            <button type="button" class="btn btn-sm btn-danger" onclick="removePORow(this)">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    `;
    container.appendChild(newRow);
}

function removePORow(btn) {
    btn.closest('.po-item-row').remove();
    calculatePOTotal();
}

function updatePOItemPrice(select) {
    const option = select.selectedOptions[0];
    const price = option.dataset.price || 0;
    select.closest('.po-item-row').querySelector('[name="item_price"]').value = price;
    calculatePOTotal();
}

function calculatePOTotal() {
    let subtotal = 0;
    document.querySelectorAll('.po-item-row').forEach(row => {
        const quantity = parseFloat(row.querySelector('[name="item_quantity"]').value) || 0;
        const price = parseFloat(row.querySelector('[name="item_price"]').value) || 0;
        subtotal += quantity * price;
    });
    
    const taxPercent = parseFloat(document.getElementById('tax_percent').value) || 0;
    const shippingCost = parseFloat(document.getElementById('shipping_cost').value) || 0;
    const tax = subtotal * (taxPercent / 100);
    const total = subtotal + tax + shippingCost;
    
    document.getElementById('po-subtotal').textContent = '₹' + subtotal.toFixed(2);
    document.getElementById('po-tax-amount').textContent = '₹' + tax.toFixed(2);
    document.getElementById('po-shipping-shown').textContent = '₹' + shippingCost.toFixed(2);
    document.getElementById('po-total-amount').textContent = '₹' + total.toFixed(2);
}

function loadSupplierDetails() {
    const select = document.getElementById('supplier_id');
    const option = select.selectedOptions[0];
    document.getElementById('supplier_contact').value = option.text;
}

document.addEventListener('DOMContentLoaded', function() {
    const today = new Date();
    const expectedDelivery = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
    document.getElementById('expected_delivery').valueAsDate = expectedDelivery;
});
</script>
{% endblock %}
